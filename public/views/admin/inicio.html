<!-- ============================================
     VISTA: admin/inicio.html  — Dashboard CREAN
     Sin scroll, compacto, monocromático
     ============================================ -->
<style>
    :root{
        --primary:#1A3C5E;
        --accent:#2E86C1;
        --pale:#EBF4FB;
        --text-dark:#0D2235;
        --text-muted:#5A8AAE;
        --success:#16A34A;
        --warning:#E67E22;
        --alert:#F9A825;
        --danger:#B2382D;
    }

    /* ── Alertas ── */
    .dalert{display:flex;align-items:center;gap:8px;padding:5px 11px;font-size:11px;border:1px solid transparent;margin-bottom:4px;}
    .dalert.danger {background:#fff5f5;border-color:#fcdcdc;border-left:3px solid var(--danger);color:#7a1f1a;border-radius:0 6px 6px 0;}
    .dalert.warning{background:#fff9f3;border-color:#fde5c8;border-left:3px solid var(--warning);color:#6b3a0a;border-radius:0 6px 6px 0;}
    .dalert.info   {background:#fefdf0;border-color:#fdf0b0;border-left:3px solid var(--alert);color:#5c4000;border-radius:0 6px 6px 0;}
    .dalert i{font-size:11px;flex-shrink:0;}

    /* ── KPI cards ── */
    .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px;}
    .kpi-card{background:var(--primary);border-radius:8px;padding:10px 14px;display:flex;align-items:center;gap:10px;position:relative;overflow:hidden;}
    .kpi-card::after{content:'';position:absolute;right:-12px;top:-12px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.06);}
    .kpi-icon{width:34px;height:34px;border-radius:7px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;flex-shrink:0;}
    .kpi-label{font-size:9px;font-weight:600;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px;}
    .kpi-val{font-size:18px;font-weight:600;color:#fff;line-height:1;}
    .kpi-sub{font-size:9px;color:rgba(255,255,255,.4);margin-top:2px;}

    /* ── Panels ── */
    .dash-panel{background:#fff;border:1px solid #d0e5f5;border-radius:8px;padding:10px 12px;height:100%;}
    .dash-panel-title{font-size:9.5px;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;padding-bottom:7px;border-bottom:1px solid var(--pale);display:flex;align-items:center;gap:5px;}
    .dash-panel-title i{color:var(--accent);font-size:12px;}

    /* ── Actividad ── */
    .act-row{display:flex;gap:8px;padding:4px 0;border-bottom:1px solid #EEF6FC;align-items:flex-start;}
    .act-row:last-child{border-bottom:none;}
    .act-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:4px;}
    .act-dot.g{background:var(--success);} .act-dot.o{background:var(--warning);}
    .act-dot.r{background:var(--danger);} .act-dot.b{background:var(--accent);}
    .act-tipo{font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--text-muted);}
    .act-desc{font-size:11px;color:var(--text-dark);font-weight:500;margin-top:1px;}
    .act-meta{font-size:9.5px;color:var(--text-muted);margin-top:1px;}

    /* ── Estado operativo ── */
    .st-sec{font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text-muted);margin:6px 0 5px;display:flex;align-items:center;gap:4px;}
    .st-sec:first-child{margin-top:0;}
    .st-item{margin-bottom:6px;}
    .st-row{display:flex;align-items:center;gap:6px;margin-bottom:2px;}
    .st-label{font-size:11px;color:var(--primary);font-weight:500;flex:1;}
    .st-count{font-size:11px;font-weight:700;color:var(--primary);min-width:16px;text-align:right;}
    .st-track{height:4px;background:var(--pale);border-radius:3px;overflow:hidden;}
    .st-bar{height:100%;border-radius:3px;transition:width .7s ease;}

    /* ── Listas ── */
    .list-row{display:flex;align-items:center;gap:7px;padding:5px 0;border-bottom:1px solid #EEF6FC;font-size:11px;}
    .list-row:last-child{border-bottom:none;}
    .list-name{color:var(--text-dark);font-weight:500;flex:1;}
    .list-muted{color:var(--text-muted);font-size:10px;}
    .dbadge{font-size:9.5px;font-weight:700;padding:1px 7px;border-radius:4px;}
    .dbadge.danger {background:#fff0f0;color:#8a1c1c;border:1px solid #fcdcdc;}
    .dbadge.warning{background:#fff9f3;color:#7a3a0a;border:1px solid #fde5c8;}
    .dbadge.op     {background:#e8f5ee;color:#145a2e;border:1px solid #b8e0c8;}
    .dbadge.mant   {background:#fff9f3;color:#7a3a0a;border:1px solid #fde5c8;}
    .dbadge.inh    {background:#fff0f0;color:#8a1c1c;border:1px solid #fcdcdc;}
    .dbadge.venc   {background:#fff0f0;color:#8a1c1c;border:1px solid #fcdcdc;}
    .dbadge.prox   {background:#fff9f3;color:#7a3a0a;border:1px solid #fde5c8;}
    .ct-av{width:22px;height:22px;border-radius:50%;background:var(--pale);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:8.5px;font-weight:700;flex-shrink:0;}

    /* ── Skeleton ── */
    .skel{background:linear-gradient(90deg,#EBF4FB 25%,#d0e5f5 50%,#EBF4FB 75%);background-size:400% 100%;animation:skel-anim 1.2s ease infinite;border-radius:5px;display:block;}
    @keyframes skel-anim{0%{background-position:100% 50%}100%{background-position:0% 50%}}

    /* ── Empty state ── */
    .empty-state{text-align:center;padding:10px 0;color:var(--text-muted);}
    .empty-state i{display:block;font-size:16px;color:var(--success);margin-bottom:3px;}
    .empty-state span{font-size:11px;}

    /* ── Divider ── */
    .dash-hr{border:none;border-top:1px solid var(--pale);margin:6px 0;}

    /* ── Gaps reducidos ── */
    .row.g-2-dash{--bs-gutter-x:.5rem;--bs-gutter-y:.5rem;}
</style>

<!-- ── CABECERA ── -->
<div class="mb-2">
    <h4 class="fw-bold mb-0" style="color:var(--primary);font-size:1.3rem;" id="dash-bienvenida">Cargando...</h4>
</div>

<!-- ── ALERTAS ── -->
<div id="dash-alertas" class="mb-2">
    <div class="skel w-100 mb-1" style="height:28px;border-radius:0 6px 6px 0;"></div>
    <div class="skel w-100" style="height:28px;border-radius:0 6px 6px 0;"></div>
</div>

<div class="kpi-grid" id="dash-kpis">

    <div class="kpi-card"><div class="kpi-icon"><i class="fa-solid fa-truck"></i></div><div><div class="kpi-label">Vehículos</div><div class="skel" style="width:36px;height:18px;background:rgba(255,255,255,.15);margin-top:2px;"></div></div></div>
    <div class="kpi-card"><div class="kpi-icon"><i class="fa-solid fa-building-wheat"></i></div><div><div class="kpi-label">Bodega granos</div><div class="skel" style="width:56px;height:18px;background:rgba(255,255,255,.15);margin-top:2px;"></div></div></div>
    <div class="kpi-card"><div class="kpi-icon"><i class="fa-solid fa-users"></i></div><div><div class="kpi-label">Empleados</div><div class="skel" style="width:36px;height:18px;background:rgba(255,255,255,.15);margin-top:2px;"></div></div></div>
</div>

        <div class="dash-panel">
            <div class="dash-panel-title"><i class="fa-solid fa-clock-rotate-left"></i>Movimientos recientes</div>
            <div id="dash-actividad">
                <div class="skel w-100 mb-1" style="height:12px;"></div>

            <div id="dash-estado">
